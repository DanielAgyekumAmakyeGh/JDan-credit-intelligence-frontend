version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xds_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: xds_credit_bureau
      MYSQL_USER: xds_user
      MYSQL_PASSWORD: xds_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup.sql
    networks:
      - xds_network

  dashboard:
    build: .
    container_name: xds_dashboard
    ports:
      - "8501:8501"
    environment:
      DB_HOST: mysql
      DB_USER: xds_user
      DB_PASSWORD: xds_password
      DB_NAME: xds_credit_bureau
    depends_on:
      - mysql
    networks:
      - xds_network
    volumes:
      - ./logs:/app/logs

volumes:
  mysql_data:

networks:
  xds_network:
    driver: bridge